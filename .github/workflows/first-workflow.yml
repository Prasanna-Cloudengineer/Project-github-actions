name: Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Display selected environment
        run: echo "Deploying to ${{ inputs.environment }}"
